<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editorial — редакция, 1956</title>
<meta name="description" content="Живая редакция: деревянные персонажи в нью-йоркской киноредакции 1950-х. Тестовая версия офиса.">
<style>
  :root { --ink:#f3e7d3; --muted:#b9a88f; --panel:rgba(20,15,12,.72); --line:rgba(243,231,211,.14); --accent:#e0913a; }
  html,body { margin:0; height:100%; background:#1b1714; color:var(--ink); overflow:hidden;
    font:15px/1.4 Georgia, "Times New Roman", serif; -webkit-font-smoothing:antialiased; }
  #view, #view canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .panel { position:fixed; left:16px; top:16px; max-width:min(420px, calc(100% - 92px)); padding:12px 14px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; backdrop-filter:blur(6px); }
  h1 { margin:0; font-size:20px; letter-spacing:.06em; text-transform:uppercase; font-weight:normal; }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  #who { margin-top:6px; font:13px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--muted); }
  #who:empty { display:none; }
  #status { margin-top:8px; font:13px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .track { height:3px; background:var(--line); border-radius:2px; margin-top:6px; overflow:hidden; }
  #bar { height:100%; width:0; background:var(--accent); transition:width .15s; }
  body.ready .track { display:none; }
  #nojs { margin-top:8px; font:12px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; color:#e7b37a; }
  body.js #nojs { display:none; }
  .bottom { position:fixed; left:16px; right:16px; bottom:max(16px, env(safe-area-inset-bottom)); display:flex;
    gap:10px; align-items:center; justify-content:space-between; pointer-events:none; }
  button { pointer-events:auto; font:14px -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:9px 14px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  #fps { pointer-events:none; font:12px -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--muted);
    background:var(--panel); border-radius:999px; padding:6px 10px; }
  #menu { position:fixed; top:16px; right:16px; width:44px; height:44px; padding:0; font-size:20px; line-height:1;
    border-radius:10px; z-index:5; }
  #settings { position:fixed; top:70px; right:16px; bottom:16px; width:min(330px, calc(100% - 32px)); overflow:auto; z-index:4;
    padding:6px 14px 14px; background:rgba(20,15,12,.9); border:1px solid var(--line); border-radius:12px; backdrop-filter:blur(8px);
    font:13px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; }
  #settings[hidden] { display:none; }
  #settings h2 { font:600 11px/1 -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin:16px 0 8px; }
  #settings .row { display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; margin:8px 0; }
  #settings .row input[type=range], #settings .row select { grid-column:1 / -1; width:100%; accent-color:var(--accent); }
  #settings .row input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); }
  #settings output { color:var(--muted); font-variant-numeric:tabular-nums; }
  #settings select { background:#2a221c; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px; }
  #settings .btns { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px; }
  #settings .btns button { font-size:13px; padding:7px 12px; }
  #settings details.sec { border-top:1px solid var(--line); }
  #settings details.sec > summary { list-style:none; cursor:pointer; padding:12px 0; font:600 11px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; }
  #settings details.sec > summary::-webkit-details-marker { display:none; }
  #settings details.sec > summary::after { content:'▸'; transition:transform .15s; }
  #settings details.sec[open] > summary::after { transform:rotate(90deg); }
  #settings details.sec[open] > summary { color:var(--ink); }
  #settings details.sec > :last-child { margin-bottom:10px; }
  #settings .rep .rc { margin:6px 0; padding:6px 8px; border:1px solid var(--line); border-radius:8px; }
  #settings .rep .rc.now { border-color:var(--accent); background:rgba(224,145,58,.12); }
  #settings .rep b { font-weight:600; } #settings .rep .dim, #settings .rep tr.dim td { color:var(--muted); }
  #settings .rep .sub { margin:12px 0 4px; font-weight:600; }
  #settings .rep table { width:100%; border-collapse:collapse; font-size:12px; }
  #settings .rep td { padding:4px 2px; border-top:1px solid var(--line); vertical-align:top; }
  #settings .rep td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hint { color:var(--muted); font:12px -apple-system, "Segoe UI", Roboto, sans-serif; margin-top:4px; }
</style>
</head>
<body>
<div id="view"></div>
<div class="panel">
  <h1>Editorial</h1>
  <div class="sub">Редакция, Нью-Йорк, 1956 · тестовая версия</div>
  <div id="status">Загрузка…</div>
  <div id="who"></div>
  <div class="track"><div id="bar"></div></div>
  <div id="nojs">Если эта надпись не исчезает 20 секунд, скрипты сайта не загрузились. Вероятно, мешают ограничения сети.</div>
  <div class="hint">Покрутить — одним пальцем, приблизить — двумя.</div>
</div>
<div class="bottom">
  <button id="tty" disabled>📠 Пришло сообщение</button>
  <span id="fps">…</span>
</div>
<noscript><div class="panel" style="top:auto;bottom:16px">Для офиса нужен JavaScript.</div></noscript>
<script src="app.js?v=49" defer></script>
</body>
</html>
