<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editorial — редакция, 1956</title>
<meta name="description" content="Живая редакция: деревянные персонажи в нью-йоркской киноредакции 1950-х. Тестовая версия офиса.">
<style>
  :root { --ink:#f3e7d3; --muted:#b9a88f; --panel:rgba(20,15,12,.72); --line:rgba(243,231,211,.14); --accent:#e0913a; }
  html,body { margin:0; height:100%; background:#1b1714; color:var(--ink); overflow:hidden;
    font:15px/1.4 Georgia, "Times New Roman", serif; -webkit-font-smoothing:antialiased; }
  #view, #view canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .panel { position:fixed; left:16px; top:16px; max-width:min(420px, calc(100% - 92px)); padding:8px 10px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; backdrop-filter:blur(6px); }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  #who { font:13px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--muted); }
  #who:empty { display:none; }
  #status { font:13px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .track { height:3px; background:var(--line); border-radius:2px; margin-top:6px; overflow:hidden; }
  #bar { height:100%; width:0; background:var(--accent); transition:width .15s; }
  body.ready #status, body.ready .track { display:none; }
  #nojs { margin-top:8px; font:12px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; color:#e7b37a; }
  body.js #nojs { display:none; }
  .bottom { position:fixed; left:16px; right:16px; bottom:max(16px, env(safe-area-inset-bottom)); display:flex;
    gap:10px; align-items:center; justify-content:flex-end; pointer-events:none; }
  button { pointer-events:auto; font:14px -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:9px 14px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  #fps { pointer-events:none; font:12px -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--muted);
    background:var(--panel); border-radius:999px; padding:6px 10px; }
  #menu { position:fixed; top:16px; right:16px; width:44px; height:44px; padding:0; font-size:20px; line-height:1;
    border-radius:10px; z-index:5; }
  #settings { position:fixed; top:70px; right:16px; width:min(380px, calc(100vw - 32px)); max-height:calc(100vh - 88px); max-height:calc(100dvh - 88px); box-sizing:border-box;
    display:flex; flex-direction:column; overflow:hidden; z-index:4; background:rgba(20,15,12,.96); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(8px);
    box-shadow:0 12px 40px rgba(0,0,0,.28); font:13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  #settings[hidden], #settings [hidden] { display:none; }
  #settings .settings-head { padding:14px 14px 12px; border-bottom:1px solid var(--line); flex-shrink:0; }
  #settings .settings-head h2 { font:600 16px/1.2 -apple-system, "Segoe UI", Roboto, sans-serif; margin:0 0 12px; color:var(--ink); }
  #settings .settings-tabs { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; }
  #settings .settings-tabs button { grid-column:span 2; padding:9px 4px; font:500 12px/1.2 -apple-system, "Segoe UI", Roboto, sans-serif; border-radius:8px; background:rgba(255,255,255,.025); }
  #settings .settings-tabs button:nth-child(n+4) { grid-column:span 3; }
  #settings .settings-tabs button[aria-selected="true"] { color:#ffd8a0; background:rgba(224,145,58,.16); border-color:rgba(224,145,58,.65); }
  #settings button:focus-visible, #settings input:focus-visible, #settings select:focus-visible, #settings summary:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  #settings .settings-body { overflow:auto; min-height:0; padding:6px 14px 14px; overscroll-behavior:contain; }
  #settings .settings-group { min-height:64px; }
  #settings .settings-group > .sec:first-child { border-top:0; }
  #settings .section-primary { border:0; }
  #settings .section-primary > summary { display:none; }
  #settings .volume-row { margin:18px 0; }
  #settings .volume-row .hint { grid-column:1 / -1; margin-top:0; }
  #settings .sound-switch { padding-bottom:10px; border-bottom:1px solid var(--line); }
  #settings .money-overview { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:8px 0 14px; }
  #settings .money-person { display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:3px; min-width:0; border-radius:10px; padding:10px; background:rgba(255,255,255,.03); }
  #settings .money-person[aria-pressed="true"] { border-color:var(--accent); background:rgba(224,145,58,.12); }
  #settings .money-name { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
  #settings .money-balance { font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; }
  #settings .money-available { font-size:11px; color:var(--muted); }
  #settings .money-detail { padding-top:2px; }
  #settings .money-detail h3 { font-size:14px; margin:8px 0; }
  #settings .money-balance-row { display:flex; justify-content:space-between; gap:8px; padding:7px 0; font-variant-numeric:tabular-nums; }
  #settings .money-balance-row > div { display:flex; flex-direction:column; gap:3px; }
  #settings .money-balance-row > div > span { color:var(--muted); font-size:12px; }
  #settings .money-balance-row > div > strong { font-size:16px; }
  #settings .money-fold { border-top:1px solid var(--line); margin-top:8px; }
  #settings .money-fold > summary { cursor:pointer; padding:11px 0; font-weight:500; }
  #settings .money-fold p { margin:7px 0; }
  #settings .settings-reset { border-top:1px solid var(--line); padding-top:12px; }
  #settings .row { display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; margin:8px 0; }
  #settings .row input[type=range], #settings .row select { grid-column:1 / -1; width:100%; accent-color:var(--accent); }
  #settings .row input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); }
  #settings output { color:var(--muted); font-variant-numeric:tabular-nums; }
  #settings select { background:#2a221c; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px; }
  #settings .btns { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px; }
  #settings .btns button { font-size:13px; padding:7px 12px; }
  #settings details.sec { border-top:1px solid var(--line); }
  #settings details.sec > summary { list-style:none; cursor:pointer; padding:12px 0; font:600 11px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; }
  #settings details.sec > summary::-webkit-details-marker { display:none; }
  #settings details.sec > summary::after { content:'▸'; transition:transform .15s; }
  #settings details.sec[open] > summary::after { transform:rotate(90deg); }
  #settings details.sec[open] > summary { color:var(--ink); }
  #settings details.sec > :last-child { margin-bottom:10px; }
  #settings details.sec.section-primary > summary { display:none; }
  #settings .rep .rc { margin:6px 0; padding:6px 8px; border:1px solid var(--line); border-radius:8px; }
  #settings .rep .rc.now { border-color:var(--accent); background:rgba(224,145,58,.12); }
  #settings .rep b { font-weight:600; } #settings .rep .dim, #settings .rep tr.dim td { color:var(--muted); }
  #settings .rep .sub { margin:12px 0 4px; font-weight:600; }
  #settings .rep table { width:100%; border-collapse:collapse; font-size:12px; }
  #settings .rep td { padding:4px 2px; border-top:1px solid var(--line); vertical-align:top; }
  #settings .rep td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #settings .modes { display:flex; gap:6px; margin:10px 0 4px; }
  #settings .modes > * { flex:1; text-align:center; padding:7px 8px; border:1px solid var(--line); border-radius:8px; color:var(--ink); text-decoration:none; font-weight:600; }
  #settings .modes b { background:rgba(224,145,58,.18); border-color:var(--accent); }
  #settings .modes a:hover { border-color:var(--accent); }
  .hint { color:var(--muted); font:12px -apple-system, "Segoe UI", Roboto, sans-serif; margin-top:4px; }
</style>
</head>
<body>
<div id="view"></div>
<div class="panel">
  <div id="status">Загрузка…</div>
  <div id="who"></div>
  <div class="track"><div id="bar"></div></div>
  <div id="nojs">Если эта надпись не исчезает 20 секунд, скрипты сайта не загрузились. Вероятно, мешают ограничения сети.</div>
</div>
<div class="bottom">
  <span id="fps">…</span>
</div>
<noscript><div class="panel" style="top:auto;bottom:16px">Для офиса нужен JavaScript.</div></noscript>
<script src="app.js?v=blocked-route-20261005-v01" defer></script>
<script src="chronicle.js?v=owner-bonuses-audio-20261004-v02" defer></script>
<script type="module" src="owner-dialogue-ui.js?v=20261005-transparent-v01"></script>
</body>
</html>
